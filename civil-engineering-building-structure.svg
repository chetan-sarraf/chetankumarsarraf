<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="1600" height="1100" viewBox="0 0 1600 1100" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
  <!--
    SCALE & SPACES CIVIL ENGINEERING BUILDING & STRUCTURAL SKETCH ASSET
    Designer: Er. Chetan Kumar Sarraf (Civil Engineer & Spatial Designer)
    Project: Multi-Storey Reinforced Concrete & Steel Frame Isometric Structure
    Compliance: NBC 205:2024 Mandatory Seismic Rule of Thumb
    Compatibility: Serif Affinity Designer v1/v2/v3, AutoCAD DXF, SVG
  -->
  <defs>
    <style type="text/css">
      .iso-col-major { stroke: #ffffff; stroke-width: 2.2px; fill: none; stroke-linecap: round; }
      .iso-beam-major { stroke: #e4e4e7; stroke-width: 1.8px; fill: none; stroke-linecap: round; }
      .iso-beam-minor { stroke: #71717a; stroke-width: 1px; stroke-dasharray: 6 4; fill: none; }
      .iso-slab-fill { fill: rgba(255, 255, 255, 0.04); stroke: #a1a1aa; stroke-width: 1.2px; }
      .iso-foundation { fill: #18181b; stroke: #52525b; stroke-width: 1.5px; }
      .iso-sketch-guide { stroke: #3f3f46; stroke-width: 0.75px; stroke-dasharray: 4 4; fill: none; }
      .iso-text-dim { font-family: 'Plus Jakarta Sans', monospace; font-size: 11px; fill: #a1a1aa; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
      .iso-text-bold { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; fill: #ffffff; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 800; }
      .iso-vector-arrow { stroke: #ffffff; stroke-width: 1.5px; fill: none; }
    </style>

    <marker id="isoArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffffff" />
    </marker>
  </defs>

  <!-- BACKGROUND BASE -->
  <rect x="0" y="0" width="1600" height="1100" fill="#09090b" />

  <!-- LAYER 1: ISOMETRIC ARCHITECTURAL GRID & GUIDELINES -->
  <g id="Layer_01_Isometric_Grid" serif:id="01 Isometric Guidelines" opacity="0.3">
    <!-- Isometric 30-degree construction lines -->
    
      <line x1="100" y1="200" x2="-200" y2="1000" class="iso-sketch-guide" />
      <line x1="500" y1="1000" x2="1200" y2="200" class="iso-sketch-guide" />
    
      <line x1="190" y1="200" x2="-110" y2="1000" class="iso-sketch-guide" />
      <line x1="590" y1="1000" x2="1290" y2="200" class="iso-sketch-guide" />
    
      <line x1="280" y1="200" x2="-20" y2="1000" class="iso-sketch-guide" />
      <line x1="680" y1="1000" x2="1380" y2="200" class="iso-sketch-guide" />
    
      <line x1="370" y1="200" x2="70" y2="1000" class="iso-sketch-guide" />
      <line x1="770" y1="1000" x2="1470" y2="200" class="iso-sketch-guide" />
    
      <line x1="460" y1="200" x2="160" y2="1000" class="iso-sketch-guide" />
      <line x1="860" y1="1000" x2="1560" y2="200" class="iso-sketch-guide" />
    
      <line x1="550" y1="200" x2="250" y2="1000" class="iso-sketch-guide" />
      <line x1="950" y1="1000" x2="1650" y2="200" class="iso-sketch-guide" />
    
      <line x1="640" y1="200" x2="340" y2="1000" class="iso-sketch-guide" />
      <line x1="1040" y1="1000" x2="1740" y2="200" class="iso-sketch-guide" />
    
      <line x1="730" y1="200" x2="430" y2="1000" class="iso-sketch-guide" />
      <line x1="1130" y1="1000" x2="1830" y2="200" class="iso-sketch-guide" />
    
      <line x1="820" y1="200" x2="520" y2="1000" class="iso-sketch-guide" />
      <line x1="1220" y1="1000" x2="1920" y2="200" class="iso-sketch-guide" />
    
      <line x1="910" y1="200" x2="610" y2="1000" class="iso-sketch-guide" />
      <line x1="1310" y1="1000" x2="2010" y2="200" class="iso-sketch-guide" />
    
      <line x1="1000" y1="200" x2="700" y2="1000" class="iso-sketch-guide" />
      <line x1="1400" y1="1000" x2="2100" y2="200" class="iso-sketch-guide" />
    
      <line x1="1090" y1="200" x2="790" y2="1000" class="iso-sketch-guide" />
      <line x1="1490" y1="1000" x2="2190" y2="200" class="iso-sketch-guide" />
    
      <line x1="1180" y1="200" x2="880" y2="1000" class="iso-sketch-guide" />
      <line x1="1580" y1="1000" x2="2280" y2="200" class="iso-sketch-guide" />
    
      <line x1="1270" y1="200" x2="970" y2="1000" class="iso-sketch-guide" />
      <line x1="1670" y1="1000" x2="2370" y2="200" class="iso-sketch-guide" />
    
      <line x1="1360" y1="200" x2="1060" y2="1000" class="iso-sketch-guide" />
      <line x1="1760" y1="1000" x2="2460" y2="200" class="iso-sketch-guide" />
    
  </g>

  <!-- LAYER 2: FOUNDATION FOOTINGS & PLINTH BEAMS (NBC 205) -->
  <g id="Layer_02_Foundation_and_Plinth" serif:id="02 Foundation Footings">
    <!-- Isolated Trapezoidal Footings at Grid Intersections -->
    <!-- Footing 1 (Front Left) -->
    <g transform="translate(420, 820)">
      <polygon points="0,0 80,-46 160,0 80,46" class="iso-foundation" />
      <polygon points="25,-8 65,-30 135,-8 95,14" fill="#27272a" stroke="#71717a" stroke-width="1.2" />
      <text x="80" y="70" class="iso-text-dim" text-anchor="middle">F1: 1500x1500mm</text>
    </g>

    <!-- Footing 2 (Front Center) -->
    <g transform="translate(740, 820)">
      <polygon points="0,0 80,-46 160,0 80,46" class="iso-foundation" />
      <polygon points="25,-8 65,-30 135,-8 95,14" fill="#27272a" stroke="#71717a" stroke-width="1.2" />
      <text x="80" y="70" class="iso-text-dim" text-anchor="middle">F2: 1800x1800mm</text>
    </g>

    <!-- Footing 3 (Front Right) -->
    <g transform="translate(1060, 820)">
      <polygon points="0,0 80,-46 160,0 80,46" class="iso-foundation" />
      <polygon points="25,-8 65,-30 135,-8 95,14" fill="#27272a" stroke="#71717a" stroke-width="1.2" />
      <text x="80" y="70" class="iso-text-dim" text-anchor="middle">F3: 1500x1500mm</text>
    </g>

    <!-- Plinth Tie Beams linking footings -->
    <polygon points="500,820 500,795 820,795 820,820" fill="none" stroke="#71717a" stroke-width="1.5" />
    <polygon points="820,820 820,795 1140,795 1140,820" fill="none" stroke="#71717a" stroke-width="1.5" />
    <text x="660" y="814" class="iso-text-dim" text-anchor="middle">PLINTH TIE BEAM 250x350mm</text>
  </g>

  <!-- LAYER 3: MULTI-STOREY STRUCTURAL COLUMNS (REINFORCED CONCRETE & STEEL) -->
  <g id="Layer_03_Structural_Columns" serif:id="03 Structural Columns">
    <!-- Ground to Roof Columns (3 storeys, Height = 600px) -->
    <!-- Col A1 (Front Left) -->
    <line x1="500" y1="800" x2="500" y2="200" class="iso-col-major" />
    <line x1="514" y1="808" x2="514" y2="208" stroke="#a1a1aa" stroke-width="1.5" />
    
    <!-- Col B1 (Front Center) -->
    <line x1="820" y1="800" x2="820" y2="200" class="iso-col-major" stroke-width="2.6" />
    <line x1="834" y1="808" x2="834" y2="208" stroke="#a1a1aa" stroke-width="1.8" />

    <!-- Col C1 (Front Right) -->
    <line x1="1140" y1="800" x2="1140" y2="200" class="iso-col-major" />
    <line x1="1154" y1="808" x2="1154" y2="208" stroke="#a1a1aa" stroke-width="1.5" />

    <!-- Col A2 (Rear Left - Isometric Depth) -->
    <line x1="320" y1="695" x2="320" y2="105" class="iso-col-major" opacity="0.6" stroke-dasharray="8 4" />

    <!-- Col B2 (Rear Center - Isometric Depth) -->
    <line x1="640" y1="695" x2="640" y2="105" class="iso-col-major" opacity="0.75" />

    <!-- Col C2 (Rear Right - Isometric Depth) -->
    <line x1="960" y1="695" x2="960" y2="105" class="iso-col-major" opacity="0.6" stroke-dasharray="8 4" />
  </g>

  <!-- LAYER 4: FLOOR SLABS & REINFORCED CONCRETE GIRDERS (STOREYS 1, 2, ROOF) -->
  <g id="Layer_04_Floor_Slabs_and_Girders" serif:id="04 Slabs and Girders">
    <!-- Storey 1 Slab (+3.60m Level) -->
    <g transform="translate(0, 400)">
      <polygon points="500,200 820,200 1140,200 960,105 640,105 320,105" class="iso-slab-fill" />
      <line x1="500" y1="200" x2="820" y2="200" class="iso-beam-major" />
      <line x1="820" y1="200" x2="1140" y2="200" class="iso-beam-major" />
      <line x1="1140" y1="200" x2="960" y2="105" class="iso-beam-major" />
      <line x1="960" y1="105" x2="640" y2="105" class="iso-beam-major" />
      <line x1="640" y1="105" x2="320" y2="105" class="iso-beam-major" />
      <line x1="320" y1="105" x2="500" y2="200" class="iso-beam-major" />
      <line x1="820" y1="200" x2="640" y2="105" class="iso-beam-major" stroke-dasharray="6 4" />
      <!-- Elevation Label -->
      <text x="240" y="155" class="iso-text-dim" text-anchor="end">FIRST FLOOR LVL +3.600m</text>
      <circle cx="255" cy="150" r="4" fill="#ffffff" />
      <line x1="260" y1="150" x2="320" y2="150" stroke="#ffffff" stroke-width="1" />
    </g>

    <!-- Storey 2 Slab (+7.20m Level) with Modern Cantilever Balcony Projection -->
    <g transform="translate(0, 200)">
      <!-- Cantilever overhang 120px to front -->
      <polygon points="460,225 820,225 1200,225 960,105 640,105 320,105" class="iso-slab-fill" fill="rgba(255,255,255,0.08)" />
      <line x1="460" y1="225" x2="1200" y2="225" class="iso-beam-major" stroke-width="2.4" />
      <line x1="1200" y1="225" x2="960" y2="105" class="iso-beam-major" />
      <line x1="460" y1="225" x2="320" y2="105" class="iso-beam-major" />
      <!-- Cantilever Notation -->
      <text x="1220" y="225" class="iso-text-bold" font-size="11px">CANTILEVER PROJECTION 1200mm</text>
      <text x="240" y="155" class="iso-text-dim" text-anchor="end">SECOND FLOOR LVL +7.200m</text>
    </g>

    <!-- Roof Parapet Slab (+10.80m Level) with Steel Pergola Grid -->
    <g transform="translate(0, 0)">
      <polygon points="500,200 820,200 1140,200 960,105 640,105 320,105" class="iso-slab-fill" />
      <line x1="500" y1="200" x2="1140" y2="200" class="iso-beam-major" />
      <line x1="1140" y1="200" x2="960" y2="105" class="iso-beam-major" />
      <line x1="960" y1="105" x2="320" y2="105" class="iso-beam-major" />
      <line x1="320" y1="105" x2="500" y2="200" class="iso-beam-major" />
      <!-- Steel Pergola Rafters -->
      
        <line x1="540" y1="190" x2="400" y2="115" stroke="#71717a" stroke-width="1.2" />
      
        <line x1="620" y1="190" x2="480" y2="115" stroke="#71717a" stroke-width="1.2" />
      
        <line x1="700" y1="190" x2="560" y2="115" stroke="#71717a" stroke-width="1.2" />
      
        <line x1="780" y1="190" x2="640" y2="115" stroke="#71717a" stroke-width="1.2" />
      
        <line x1="860" y1="190" x2="720" y2="115" stroke="#71717a" stroke-width="1.2" />
      
        <line x1="940" y1="190" x2="800" y2="115" stroke="#71717a" stroke-width="1.2" />
      
        <line x1="1020" y1="190" x2="880" y2="115" stroke="#71717a" stroke-width="1.2" />
      
      <text x="240" y="155" class="iso-text-dim" text-anchor="end">ROOF PARAPET LVL +10.800m</text>
    </g>
  </g>

  <!-- LAYER 5: SEISMIC CROSS-BRACING & LOAD VECTORS (CIVIL ENGINEERING RIGOR) -->
  <g id="Layer_05_Seismic_Bracing" serif:id="05 Seismic Cross-Bracing">
    <!-- X-Bracing on Central Span -->
    <line x1="500" y1="800" x2="820" y2="600" class="iso-beam-minor" stroke="#a1a1aa" />
    <line x1="820" y1="800" x2="500" y2="600" class="iso-beam-minor" stroke="#a1a1aa" />

    <line x1="500" y1="600" x2="820" y2="400" class="iso-beam-minor" stroke="#a1a1aa" />
    <line x1="820" y1="600" x2="500" y2="400" class="iso-beam-minor" stroke="#a1a1aa" />

    <!-- Load Distribution Arrows (Gravity & Lateral Wind/Earthquake) -->
    <g transform="translate(820, 160)">
      <line x1="0" y1="-30" x2="0" y2="15" class="iso-vector-arrow" marker-end="url(#isoArrow)" />
      <text x="12" y="-5" class="iso-text-bold" font-size="11px">DL + LL = 45 kN/m²</text>
    </g>
    <g transform="translate(1180, 400)">
      <line x1="50" y1="0" x2="-10" y2="0" class="iso-vector-arrow" marker-end="url(#isoArrow)" />
      <text x="60" y="5" class="iso-text-bold" font-size="11px">LATERAL SEISMIC EQx (NBC 205)</text>
    </g>
  </g>

  <!-- LAYER 6: ARCHITECTURAL SKETCH OVERLAY & FREEHAND GESTURE LINES -->
  <g id="Layer_06_Architectural_Sketch" serif:id="06 Hand-Drawn Sketch Overlays">
    <!-- Freehand Perspective Vanishing Lines -->
    <path d="M 120,400 Q 500,200 960,105 T 1500,50" stroke="#71717a" stroke-width="0.8" fill="none" opacity="0.4" />
    <path d="M 500,800 Q 820,800 1140,800 T 1450,850" stroke="#71717a" stroke-width="0.8" fill="none" opacity="0.4" />
    
    <!-- Drafting Compass Arc sweeping across building facade -->
    <path d="M 500,200 A 620,620 0 0,1 1140,800" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="10 6" fill="none" opacity="0.75" />
    <text x="880" y="520" class="iso-text-dim" fill="#ffffff">FAÇADE CURVATURE R=6200mm</text>
  </g>

  <!-- LAYER 7: OFFICIAL ENGINEERING TITLE BLOCK & SPECIFICATION -->
  <g id="Layer_07_Title_Block" serif:id="07 Title Block" transform="translate(1080, 930)">
    <rect x="0" y="0" width="480" height="135" fill="#121215" stroke="#3f3f46" stroke-width="1.5" rx="8" />
    <line x1="0" y1="36" x2="480" y2="36" stroke="#27272a" stroke-width="1" />
    <line x1="0" y1="84" x2="480" y2="84" stroke="#27272a" stroke-width="1" />
    
    <text x="16" y="24" class="iso-text-bold">SCALE &amp; SPACES · CIVIL &amp; SPATIAL RIGOR</text>
    <text x="460" y="24" class="iso-text-dim" text-anchor="end" fill="#ffffff">NBC 205:2024</text>

    <text x="16" y="55" class="iso-text-dim" font-size="9px">STRUCTURAL SPECIFICATION</text>
    <text x="16" y="73" class="iso-text-bold" font-size="12px">M20 CONCRETE · Fe500 TMT REBAR · ISOLATED FOOTINGS</text>

    <text x="16" y="103" class="iso-text-dim" font-size="9px">LEAD CIVIL ENGINEER &amp; INTERIOR DESIGNER</text>
    <text x="16" y="121" class="iso-text-bold" font-size="12px">ER. CHETAN KUMAR SARRAF · BIRGUNJ, NEPAL</text>
  </g>
</svg>